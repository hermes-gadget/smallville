{% load staticfiles %}
<script type="text/javascript">
	(function() {
		"use strict";

		// -----------------------------------------------------------------------
		// Simulation state. The update endpoint's step/sim_code payload stays
		// stable; the autonomous backend now advances the environment itself.
		// -----------------------------------------------------------------------
		var step = parseInt(document.getElementById("step").textContent, 10);
		var sim_code = document.getElementById("sim_code").textContent.trim();
		var tile_width = 32;
		var movement_speed = 32;
		var phase = "update";
		var execute_movement = null;
		var execute_count_max = tile_width / movement_speed;
		var execute_count = execute_count_max;
		var movement_target = {};
		var update_request_in_flight = false;
		var update_poll_interval_ms = 2000;
		var next_update_poll_at = 0;
		var chat_request_in_flight = false;
		var chat_signature = "";
		var speaker_colors = {};
		var speaker_color_count = 0;

		var spawn_tile_loc = {};
		var persona_order = [];
		document.querySelectorAll("#persona_init_pos span").forEach(function(node) {
			var name = node.getAttribute("data-name");
			var x = parseInt(node.getAttribute("data-x"), 10);
			var y = parseInt(node.getAttribute("data-y"), 10);
			spawn_tile_loc[name] = [x, y];
			persona_order.push(name);
			setText("target_address__" + personaSlug(name), "Tile " + x + ", " + y);
		});
		var resident_order = [];
		document.querySelectorAll(".resident-card").forEach(function(card) {
			resident_order.push(card.getAttribute("data-persona"));
		});

		var personas = {};
		var modal_persona = null;
		function updateModalLive() {
			if (!modal_persona) return;
			var state = execute_movement && execute_movement.persona
				? execute_movement.persona[modal_persona]
				: null;
			if (!state) {
				setText("rm-live", "Awaiting action");
				setText("rm-location", "Location pending");
				return;
			}
			var description = String(state.description || "");
			var separator = description.indexOf("@");
			setText("rm-live", separator === -1
				? (description.trim() || "Taking in the town")
				: description.slice(0, separator).trim() || "Taking in the town");
			setText("rm-location", separator === -1
				? "Location unavailable"
				: description.slice(separator + 1).trim() || "Location unavailable");
		}
		var persona_labels = {};
		var persona_rings = {};
		var persona_animations = {};
		var previous_directions = {};
		var selected_persona = null;
		var main_camera = null;
		var map_pixel_width = 0;
		var map_pixel_height = 0;
		var cursors = null;
		var stage_resize_observer = null;

		var game_container = document.getElementById("game-container");
		var map_stage = document.getElementById("map-stage");
		var character_root = "{% static 'assets/characters/' %}";
		var character_atlas = "{% static 'assets/characters/atlas.json' %}";
		var fallback_texture_key = "resident-texture__fallback";

		var config = {
			type: Phaser.AUTO,
			width: Math.max(1, map_stage.clientWidth),
			height: Math.max(1, map_stage.clientHeight),
			parent: "game-container",
			backgroundColor: "#09151e",
			pixelArt: true,
			render: {
				antialias: false,
				roundPixels: true
			},
			physics: {
				default: "arcade",
				arcade: { gravity: { y: 0 } }
			},
			scene: {
				preload: preload,
				create: create,
				update: update
			}
		};

		var game = new Phaser.Game(config);
		bindInterfaceControls();
		startChatPolling();

		function preload() {
			this.load.image("blocks_1", "{% static 'assets/the_ville/visuals/map_assets/blocks/blocks_1.png' %}");
			this.load.image("walls", "{% static 'assets/the_ville/visuals/map_assets/v1/Room_Builder_32x32.png' %}");
			this.load.image("interiors_pt1", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt1.png' %}");
			this.load.image("interiors_pt2", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt2.png' %}");
			this.load.image("interiors_pt3", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt3.png' %}");
			this.load.image("interiors_pt4", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt4.png' %}");
			this.load.image("interiors_pt5", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt5.png' %}");
			this.load.image("CuteRPG_Field_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_B.png' %}");
			this.load.image("CuteRPG_Field_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_C.png' %}");
			this.load.image("CuteRPG_Harbor_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Harbor_C.png' %}");
			this.load.image("CuteRPG_Village_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Village_B.png' %}");
			this.load.image("CuteRPG_Forest_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_B.png' %}");
			this.load.image("CuteRPG_Desert_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_C.png' %}");
			this.load.image("CuteRPG_Mountains_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Mountains_B.png' %}");
			this.load.image("CuteRPG_Desert_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_B.png' %}");
			this.load.image("CuteRPG_Forest_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_C.png' %}");
			this.load.tilemapTiledJSON("map", "{% static 'assets/the_ville/visuals/the_ville_jan7.json' %}");

			// Keep one known-local atlas as a generic fallback for residents whose
			// dedicated sprite is unavailable.
			this.load.atlas(
				fallback_texture_key,
				character_root + "Yuriko_Yamamoto.png",
				character_atlas
			);
			persona_order.forEach(function(name) {
				this.load.atlas(
					personaTextureKey(name),
					character_root + personaSlug(name) + ".png",
					character_atlas
				);
			}, this);
		}

		function create() {
			var map = this.make.tilemap({ key: "map" });
			map_pixel_width = map.widthInPixels;
			map_pixel_height = map.heightInPixels;

			var collisions = map.addTilesetImage("blocks", "blocks_1");
			var walls = map.addTilesetImage("Room_Builder_32x32", "walls");
			var interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
			var interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
			var interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
			var interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
			var interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
			var field_b = map.addTilesetImage("CuteRPG_Field_B", "CuteRPG_Field_B");
			var field_c = map.addTilesetImage("CuteRPG_Field_C", "CuteRPG_Field_C");
			var harbor_c = map.addTilesetImage("CuteRPG_Harbor_C", "CuteRPG_Harbor_C");
			var village_b = map.addTilesetImage("CuteRPG_Village_B", "CuteRPG_Village_B");
			var forest_b = map.addTilesetImage("CuteRPG_Forest_B", "CuteRPG_Forest_B");
			var desert_c = map.addTilesetImage("CuteRPG_Desert_C", "CuteRPG_Desert_C");
			var mountains_b = map.addTilesetImage("CuteRPG_Mountains_B", "CuteRPG_Mountains_B");
			var desert_b = map.addTilesetImage("CuteRPG_Desert_B", "CuteRPG_Desert_B");
			var forest_c = map.addTilesetImage("CuteRPG_Forest_C", "CuteRPG_Forest_C");
			var tilesets = [
				field_b, field_c, harbor_c, village_b, forest_b, desert_c,
				mountains_b, desert_b, forest_c, interiors_pt1, interiors_pt2,
				interiors_pt3, interiors_pt4, interiors_pt5, walls
			];

			map.createLayer("Bottom Ground", tilesets, 0, 0);
			map.createLayer("Exterior Ground", tilesets, 0, 0);
			map.createLayer("Exterior Decoration L1", tilesets, 0, 0);
			map.createLayer("Exterior Decoration L2", tilesets, 0, 0);
			map.createLayer("Interior Ground", tilesets, 0, 0);
			map.createLayer("Wall", [field_c, walls], 0, 0);
			map.createLayer("Interior Furniture L1", tilesets, 0, 0);
			map.createLayer("Interior Furniture L2 ", tilesets, 0, 0);
			var foreground_l1 = map.createLayer("Foreground L1", tilesets, 0, 0);
			var foreground_l2 = map.createLayer("Foreground L2", tilesets, 0, 0);
			foreground_l1.setDepth(2);
			foreground_l2.setDepth(2);

			var collisions_layer = map.createLayer("Collisions", collisions, 0, 0);
			collisions_layer.setCollisionByProperty({ collide: true });
			collisions_layer.setDepth(-1);

			main_camera = this.cameras.main;
			main_camera.setBounds(0, 0, map_pixel_width, map_pixel_height);
			main_camera.roundPixels = true;
			cursors = this.input.keyboard.createCursorKeys();

			createPersonas(this);
			installMapPointerControls(this);
			installResizeHandling(this);
			bindReplayControls(this);

			var initial_center = getInitialMapCenter();
			main_camera.centerOn(initial_center.x, initial_center.y);
			if (persona_order.length) selectPersona(persona_order[0], false);

			window.requestAnimationFrame(function() {
				document.getElementById("map-loading").classList.add("is-hidden");
			});
		}

		function createPersonas(scene) {
			persona_order.forEach(function(name) {
				var start = spawn_tile_loc[name];
				var x = tileToWorld(start[0]);
				var y = tileToWorld(start[1]);
				var texture_key = textureForPersona(scene, name);
				var sprite = scene.add.sprite(x, y, texture_key, "down").setDepth(1);
				sprite.setInteractive({ useHandCursor: true });
				sprite.setData("personaName", name);
				personas[name] = sprite;
				previous_directions[name] = "d";

				var ring = scene.add.ellipse(x, y + 12, 27, 11, 0xf2bd62, .13)
					.setStrokeStyle(1.5, 0xf2bd62, .95)
					.setDepth(.9)
					.setVisible(false);
				persona_rings[name] = ring;
				persona_labels[name] = createSpeechBubble(scene, x, y - 21);
				persona_animations[name] = createPersonaAnimations(scene, name, texture_key);

				sprite.on("pointerover", function() {
					if (selected_persona !== name) ring.setVisible(true).setAlpha(.45);
				});
				sprite.on("pointerout", function() {
					if (selected_persona !== name) ring.setVisible(false).setAlpha(1);
				});
				sprite.on("pointerdown", function() {
					selectPersona(name, false);
				});
			});
		}

		function createPersonaAnimations(scene, name, texture_key) {
			var slug = personaSlug(name);
			var keys = {
				l: "resident-left__" + slug,
				r: "resident-right__" + slug,
				u: "resident-up__" + slug,
				d: "resident-down__" + slug
			};
			[
				["l", "left-walk."],
				["r", "right-walk."],
				["u", "up-walk."],
				["d", "down-walk."]
			].forEach(function(definition) {
				scene.anims.create({
					key: keys[definition[0]],
					frames: scene.anims.generateFrameNames(texture_key, {
						prefix: definition[1],
						start: 0,
						end: 3,
						zeroPad: 3
					}),
					frameRate: 5,
					repeat: -1
				});
			});
			return keys;
		}

		function createSpeechBubble(scene, x, y) {
			var background = scene.add.graphics();
			var text = scene.add.text(0, -8, "", {
				fontFamily: "ui-sans-serif, system-ui, sans-serif",
				fontSize: "11px",
				fontStyle: "600",
				color: "#eef8f6",
				align: "center",
				wordWrap: { width: 190, useAdvancedWrap: true },
				resolution: 2
			}).setOrigin(.5, 1);
			var container = scene.add.container(x, y, [background, text])
				.setDepth(6)
				.setVisible(false);

			return {
				container: container,
				setText: function(value) {
					if (!value) {
						container.setVisible(false);
						return;
					}
					text.setText(value);
					var width = Math.max(34, Math.min(208, text.width + 20));
					var height = text.height + 15;
					background.clear();
					background.fillStyle(0x08141f, .92);
					background.lineStyle(1, 0x8be3ca, .42);
					background.fillRoundedRect(-width / 2, -height - 4, width, height, 8);
					background.strokeRoundedRect(-width / 2, -height - 4, width, height, 8);
					background.fillTriangle(-4, -5, 4, -5, 0, 1);
					container.setVisible(true);
				},
				setPosition: function(next_x, next_y) {
					container.setPosition(next_x, next_y);
				}
			};
		}

		function installMapPointerControls(scene) {
			var drag = null;
			var moved = false;
			var pressed_persona = null;
			var threshold = 5;

			scene.input.on("pointerdown", function(pointer, game_objects) {
				drag = {
					x: pointer.x,
					y: pointer.y,
					scroll_x: main_camera.scrollX,
					scroll_y: main_camera.scrollY
				};
				moved = false;
				pressed_persona = null;
				(game_objects || []).some(function(object) {
					var name = object.getData && object.getData("personaName");
					if (name) pressed_persona = name;
					return Boolean(name);
				});
			});

			scene.input.on("pointermove", function(pointer) {
				if (!drag || !pointer.isDown) return;
				var dx = pointer.x - drag.x;
				var dy = pointer.y - drag.y;
				if (!moved && Math.sqrt(dx * dx + dy * dy) >= threshold) {
					moved = true;
					game_container.classList.add("is-dragging");
				}
				if (moved) {
					setCameraScroll(drag.scroll_x - dx, drag.scroll_y - dy);
				}
			});

			function finishPointer() {
				if (!drag) return;
				if (!moved && pressed_persona) {
					selectPersona(pressed_persona, true);
				} else if (!moved) {
					clearPersonaSelection();
				}
				drag = null;
				moved = false;
				pressed_persona = null;
				game_container.classList.remove("is-dragging");
			}

			scene.input.on("pointerup", finishPointer);
			scene.input.on("pointerupoutside", finishPointer);
			window.addEventListener("blur", finishPointer);
		}

		function installResizeHandling(scene) {
			var resize_pending = false;
			function resizeGame() {
				if (resize_pending) return;
				resize_pending = true;
				window.requestAnimationFrame(function() {
					resize_pending = false;
					var width = Math.max(1, map_stage.clientWidth);
					var height = Math.max(1, map_stage.clientHeight);
					if (scene.scale.width === width && scene.scale.height === height) return;
					var center_x = main_camera ? main_camera.midPoint.x : 0;
					var center_y = main_camera ? main_camera.midPoint.y : 0;
					scene.scale.resize(width, height);
					if (main_camera) main_camera.centerOn(center_x, center_y);
				});
			}

			if (window.ResizeObserver) {
				stage_resize_observer = new ResizeObserver(resizeGame);
				stage_resize_observer.observe(map_stage);
			} else {
				window.addEventListener("resize", resizeGame);
			}
		}

		function bindReplayControls(scene) {
			var play_button = document.getElementById("play_button");
			var pause_button = document.getElementById("pause_button");
			if (play_button) {
				play_button.addEventListener("click", function() { scene.scene.resume(); });
			}
			if (pause_button) {
				pause_button.addEventListener("click", function() { scene.scene.pause(); });
			}
		}

		function update(time, delta) {
			moveCameraWithKeyboard(delta);

			if (phase === "update") {
				pollForMovement();
				return;
			}

			executeMovementStep();
		}

		function moveCameraWithKeyboard(delta) {
			if (!main_camera || !cursors) return;
			var distance = 520 * Math.min(delta, 40) / 1000;
			var dx = 0;
			var dy = 0;
			if (cursors.left.isDown) dx -= distance;
			if (cursors.right.isDown) dx += distance;
			if (cursors.up.isDown) dy -= distance;
			if (cursors.down.isDown) dy += distance;
			if (dx || dy) setCameraScroll(main_camera.scrollX + dx, main_camera.scrollY + dy);
		}

		function pollForMovement() {
			var now = Date.now();
			if (now >= next_update_poll_at && !update_request_in_flight) {
				next_update_poll_at = now + update_poll_interval_ms;
				update_request_in_flight = true;
				var request = new XMLHttpRequest();
				request.overrideMimeType("application/json");
				request.open("POST", "{% url 'update_environment' %}", true);
				request.timeout = 15000;
				request.addEventListener("load", function() {
					if (request.readyState !== 4 || request.status !== 200) return;
					var payload;
					try {
						payload = JSON.parse(request.responseText);
					} catch (error) {
						return;
					}
					if (payload["<step>"] == step) {
						execute_movement = payload;
						phase = "execute";
					}
				});
				request.addEventListener("loadend", function() {
					update_request_in_flight = false;
				});
				request.send(JSON.stringify({ "step": step, "sim_code": sim_code }));
			}
		}

		function executeMovementStep() {
			if (!execute_movement || !execute_movement.persona) return;
			if (execute_movement.meta && execute_movement.meta.curr_time) {
				setText("game-time-content", execute_movement.meta.curr_time);
			}

			if (execute_count === execute_count_max) {
				prepareMovementTargets();
			}

			if (execute_count > 0) {
				persona_order.forEach(movePersonaOneFrame);
				execute_count -= 1;
				return;
			}

			persona_order.forEach(function(name) {
				var target = movement_target[name];
				if (!target) return;
				personas[name].setPosition(target[0], target[1]);
				stopPersonaAnimation(name);
				positionPersonaDecorations(name);
			});
			phase = "update";
			execute_count = execute_count_max;
			step += 1;
		}

		function prepareMovementTargets() {
			resident_order.forEach(function(name) {
				var state = execute_movement.persona[name];
				if (!state) {
					delete movement_target[name];
					updateResidentCard(name, null);
					return;
				}
				updateResidentCard(name, state);
				if (modal_persona === name) updateModalLive();
				if (!personas[name] || !Array.isArray(state.movement) || state.movement.length < 2) {
					delete movement_target[name];
					return;
				}
				movement_target[name] = [
					tileToWorld(state.movement[0]),
					tileToWorld(state.movement[1])
				];

				var initials = personaInitials(name);
				var pronunciatio = state.pronunciatio || "";
				persona_labels[name].setText(pronunciatio ? initials + ": " + pronunciatio : "");
			});
		}

		function movePersonaOneFrame(name) {
			var sprite = personas[name];
			var target = movement_target[name];
			if (!sprite || !target) return;
			var direction = "";

			if (sprite.x < target[0]) {
				sprite.x = Math.min(target[0], sprite.x + movement_speed);
				direction = "r";
			} else if (sprite.x > target[0]) {
				sprite.x = Math.max(target[0], sprite.x - movement_speed);
				direction = "l";
			} else if (sprite.y < target[1]) {
				sprite.y = Math.min(target[1], sprite.y + movement_speed);
				direction = "d";
			} else if (sprite.y > target[1]) {
				sprite.y = Math.max(target[1], sprite.y - movement_speed);
				direction = "u";
			}

			if (direction) {
				previous_directions[name] = direction;
				sprite.anims.play(persona_animations[name][direction], true);
			} else {
				stopPersonaAnimation(name);
			}
			positionPersonaDecorations(name);
		}

		function stopPersonaAnimation(name) {
			var sprite = personas[name];
			if (!sprite) return;
			sprite.anims.stop();
			var idle_frames = { l: "left", r: "right", u: "up", d: "down" };
			sprite.setFrame(idle_frames[previous_directions[name]] || "down");
		}

		function positionPersonaDecorations(name) {
			var sprite = personas[name];
			if (!sprite) return;
			persona_rings[name].setPosition(sprite.x, sprite.y + 12);
			persona_labels[name].setPosition(sprite.x, sprite.y - 21);
		}

		function updateResidentCard(name, state) {
			var card = document.getElementById("resident-card__" + personaSlug(name));
			if (card) {
				card.classList.toggle("is-awaiting", !state);
				var status = card.querySelector(".resident-status");
				status.setAttribute("title", state ? "Live" : "Awaiting action");
				status.setAttribute("aria-label", state ? "Live" : "Awaiting action");
			}
			if (!state) {
				setText("current_action__" + personaSlug(name), "Awaiting action");
				setText("target_address__" + personaSlug(name), "Location pending");
				setText("chat__" + personaSlug(name), "None at the moment");
				return;
			}
			var description = String(state.description || "");
			var separator = description.indexOf("@");
			var action = separator === -1 ? description : description.slice(0, separator);
			var location = separator === -1 ? "Location unavailable" : description.slice(separator + 1);
			var slug = personaSlug(name);
			setText("current_action__" + slug, action.trim() || "Taking in the town");
			setText("target_address__" + slug, location.trim() || "Location unavailable");

			var chat = Array.isArray(state.chat) ? state.chat.map(function(line) {
				return line[0] + ": " + line[1];
			}).join("\n") : "None at the moment";
			setText("chat__" + slug, chat);
		}

		function bindInterfaceControls() {
			document.querySelectorAll(".resident-avatar img").forEach(function(image) {
				image.addEventListener("error", function() {
					var fallback = image.getAttribute("data-fallback-src");
					if (fallback && image.getAttribute("src") !== fallback) image.setAttribute("src", fallback);
				});
			});
			document.querySelectorAll(".resident-card").forEach(function(card) {
				card.querySelector(".resident-focus").addEventListener("click", function() {
					selectPersona(card.getAttribute("data-persona"), true);
				});
			});

			var sidebar = document.getElementById("resident-sidebar");
			var scrim = document.getElementById("sidebar-scrim");
			function openSidebar() {
				document.body.classList.add("sidebar-open");
				sidebar.classList.add("is-open");
				scrim.classList.add("is-visible");
				document.getElementById("sidebar-open").setAttribute("aria-expanded", "true");
			}
			function closeSidebar() {
				document.body.classList.remove("sidebar-open");
				sidebar.classList.remove("is-open");
				scrim.classList.remove("is-visible");
				document.getElementById("sidebar-open").setAttribute("aria-expanded", "false");
			}

			document.getElementById("sidebar-open").addEventListener("click", openSidebar);
			document.getElementById("sidebar-close").addEventListener("click", closeSidebar);
			scrim.addEventListener("click", closeSidebar);

			var chat_panel = document.getElementById("chat-panel");
			var chat_toggle = document.getElementById("chat-toggle");
			chat_toggle.addEventListener("click", function() {
				var collapsed = chat_panel.classList.toggle("is-collapsed");
				chat_toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
				chat_toggle.setAttribute("aria-label", collapsed ? "Expand conversations" : "Collapse conversations");
				chat_toggle.textContent = collapsed ? "+" : "−";
			});

			// Resident details modal (replaces the old replay_persona_state page).
			var resident_modal = document.getElementById("resident-modal");
			function openResidentModal(name) {
				modal_persona = name;
				document.getElementById("rm-name").textContent = name;
				var avatar = document.getElementById("rm-avatar");
				var img = document.createElement("img");
				img.src = "{% static 'assets/characters/profile/' %}" + personaSlug(name) + ".png";
				img.onerror = function() {
					img.onerror = null;
					img.src = "{% static 'assets/characters/profile/Yuriko_Yamamoto.png' %}";
				};
				avatar.parentNode.replaceChild(img, avatar);
				img.setAttribute("id", "rm-avatar");
				img.setAttribute("width", "56");
				img.setAttribute("height", "56");
				updateModalLive();
				var request = new XMLHttpRequest();
				request.overrideMimeType("application/json");
				request.open("GET", "{% url 'persona_state' %}?sim_code=" + encodeURIComponent(sim_code) + "&persona_name=" + encodeURIComponent(personaSlug(name)), true);
				request.timeout = 15000;
				request.addEventListener("load", function() {
					if (request.readyState !== 4 || request.status !== 200) return;
					var payload;
					try {
						payload = JSON.parse(request.responseText);
					} catch (error) {
						return;
					}
					if (!payload || payload.error) return;
					setText("rm-innate", payload.innate || "—");
					setText("rm-learned", payload.learned || "—");
					setText("rm-currently", payload.currently || "—");
					setText("rm-plan", payload.daily_plan_req || "—");
					setText("rm-lifestyle", payload.lifestyle || "—");
				});
				request.send();
				resident_modal.classList.add("is-open");
				resident_modal.setAttribute("aria-hidden", "false");
			}
			function closeResidentModal() {
				modal_persona = null;
				resident_modal.classList.remove("is-open");
				resident_modal.setAttribute("aria-hidden", "true");
			}
			document.querySelectorAll(".resident-details").forEach(function(button) {
				button.addEventListener("click", function() {
					openResidentModal(button.getAttribute("data-persona"));
				});
			});
			document.querySelectorAll("[data-close-modal]").forEach(function(el) {
				el.addEventListener("click", closeResidentModal);
			});
			document.addEventListener("keydown", function(event) {
				if (event.key === "Escape") closeSidebar();
				if (event.key === "Escape") closeResidentModal();
			});
		}

		function startChatPolling() {
			pollChatLog();
			window.setInterval(pollChatLog, 2000);
		}

		function pollChatLog() {
			if (chat_request_in_flight) return;
			chat_request_in_flight = true;
			var request = new XMLHttpRequest();
			request.overrideMimeType("application/json");
			request.open("GET", "{% url 'get_chat_log' %}?sim_code=" + encodeURIComponent(sim_code), true);
			request.timeout = 15000;
			request.addEventListener("load", function() {
				if (request.readyState !== 4 || request.status !== 200) return;
				var payload;
				try {
					payload = JSON.parse(request.responseText);
				} catch (error) {
					return;
				}
				if (payload && Array.isArray(payload.entries)) renderChatEntries(payload.entries);
			});
			request.addEventListener("loadend", function() {
				chat_request_in_flight = false;
			});
			request.send();
		}

		function renderChatEntries(entries) {
			var signature;
			try {
				signature = JSON.stringify(entries);
			} catch (error) {
				return;
			}
			if (signature === chat_signature) return;
			chat_signature = signature;

			var feed = document.getElementById("chat-feed");
			var near_bottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 48;
			var previous_scroll_top = feed.scrollTop;
			while (feed.firstChild) feed.removeChild(feed.firstChild);

			if (!entries.length) {
				var empty = document.createElement("p");
				empty.className = "chat-empty";
				empty.textContent = "Conversations between residents will appear here as the town unfolds.";
				feed.appendChild(empty);
				setText("chat-count", "Waiting for the first conversation");
				return;
			}

			entries.forEach(function(entry) {
				var lines = normaliseChatLines(entry && entry.chat);
				if (!lines.length) return;
				var participants = [];
				var participant_lookup = {};
				lines.forEach(function(line) {
					if (!participant_lookup[line.speaker]) {
						participant_lookup[line.speaker] = true;
						participants.push(line.speaker);
					}
				});

				var article = document.createElement("article");
				article.className = "chat-entry";
				var meta = document.createElement("div");
				meta.className = "chat-entry__meta";
				var participant_node = document.createElement("span");
				participant_node.className = "chat-entry__participants";
				participant_node.textContent = participants.join(" + ");
				var time_node = document.createElement("span");
				time_node.className = "chat-entry__time";
				time_node.textContent = chatTimestamp(entry);
				meta.appendChild(participant_node);
				meta.appendChild(time_node);
				article.appendChild(meta);

				lines.forEach(function(line) {
					var row = document.createElement("div");
					row.className = "chat-line";
					var speaker = document.createElement("span");
					speaker.className = "chat-line__speaker";
					speaker.style.color = speakerColor(line.speaker);
					speaker.textContent = line.speaker;
					var utterance = document.createElement("span");
					utterance.className = "chat-line__utterance";
					utterance.textContent = line.utterance;
					row.appendChild(speaker);
					row.appendChild(utterance);
					article.appendChild(row);
				});
				feed.appendChild(article);
			});

			setText("chat-count", entries.length + (entries.length === 1 ? " conversation" : " conversations"));
			feed.scrollTop = near_bottom ? feed.scrollHeight : previous_scroll_top;
		}

		function normaliseChatLines(chat) {
			var lines = [];
			if (Array.isArray(chat)) {
				chat.forEach(function(line) {
					var speaker = Array.isArray(line) ? line[0] : line && (line.speaker || line.name);
					var utterance = Array.isArray(line) ? line[1] : line && (line.utterance || line.text);
					if (speaker && utterance !== undefined && utterance !== null) {
						lines.push({ speaker: String(speaker), utterance: String(utterance) });
					}
				});
			} else if (typeof chat === "string" && chat.trim()) {
				chat.split(/\r?\n/).forEach(function(line) {
					var separator = line.indexOf(":");
					lines.push({
						speaker: separator === -1 ? "Resident" : line.slice(0, separator).trim(),
						utterance: separator === -1 ? line.trim() : line.slice(separator + 1).trim()
					});
				});
			}
			return lines;
		}

		function chatTimestamp(entry) {
			var timestamp = entry && entry.ts ? String(entry.ts) : "";
			var time_match = timestamp.match(/\b\d{2}:\d{2}(?::\d{2})?\b/);
			var time = time_match ? time_match[0] : timestamp;
			var step_label = entry && entry.step !== undefined ? "step " + entry.step : "";
			return [time, step_label].filter(Boolean).join(" · ");
		}

		function speakerColor(name) {
			if (!Object.prototype.hasOwnProperty.call(speaker_colors, name)) {
				var hue = Math.round((speaker_color_count * 137.508 + 164) % 360);
				speaker_colors[name] = "hsl(" + hue + ", 72%, 70%)";
				speaker_color_count += 1;
			}
			return speaker_colors[name];
		}

		function selectPersona(name, center_map) {
			if (!name) return;
			selected_persona = name;
			document.querySelectorAll(".resident-card").forEach(function(card) {
				var selected = card.getAttribute("data-persona") === name;
				card.classList.toggle("is-selected", selected);
				card.querySelector(".resident-focus").setAttribute("aria-pressed", selected ? "true" : "false");
			});
			Object.keys(persona_rings).forEach(function(persona_name) {
				persona_rings[persona_name].setVisible(persona_name === name).setAlpha(1);
			});

			setText("focused-resident", name);
			document.getElementById("focus-chip").classList.add("is-visible");
			if (center_map && personas[name] && main_camera) {
				main_camera.pan(personas[name].x, personas[name].y, 430, "Sine.easeInOut", true);
			}
			if (window.matchMedia("(max-width: 1000px)").matches) {
				document.body.classList.remove("sidebar-open");
				document.getElementById("resident-sidebar").classList.remove("is-open");
				document.getElementById("sidebar-scrim").classList.remove("is-visible");
				document.getElementById("sidebar-open").setAttribute("aria-expanded", "false");
			}
		}

		function clearPersonaSelection() {
			selected_persona = null;
			document.querySelectorAll(".resident-card").forEach(function(card) {
				card.classList.remove("is-selected");
				card.querySelector(".resident-focus").setAttribute("aria-pressed", "false");
			});
			Object.keys(persona_rings).forEach(function(name) {
				persona_rings[name].setVisible(false).setAlpha(1);
			});
			document.getElementById("focus-chip").classList.remove("is-visible");
		}

		function setCameraScroll(x, y) {
			if (!main_camera) return;
			main_camera.setScroll(
				Phaser.Math.Clamp(x, 0, Math.max(0, map_pixel_width - main_camera.width)),
				Phaser.Math.Clamp(y, 0, Math.max(0, map_pixel_height - main_camera.height))
			);
		}

		function getInitialMapCenter() {
			if (!persona_order.length) return { x: 800, y: 288 };
			var first = spawn_tile_loc[persona_order[0]];
			return { x: tileToWorld(first[0]), y: tileToWorld(first[1]) };
		}

		function tileToWorld(tile) {
			return tile * tile_width + tile_width / 2;
		}

		function personaSlug(name) {
			return name.replace(/ /g, "_");
		}

		function personaTextureKey(name) {
			return "resident-texture__" + personaSlug(name);
		}

		function textureForPersona(scene, name) {
			var texture_key = personaTextureKey(name);
			return scene.textures.exists(texture_key) ? texture_key : fallback_texture_key;
		}

		function personaInitials(name) {
			return name.split(/\s+/).filter(Boolean).map(function(part) {
				return part.charAt(0);
			}).slice(0, 2).join("").toUpperCase();
		}

		function setText(id, value) {
			var node = document.getElementById(id);
			if (node) node.textContent = value;
		}
	})();
</script>
