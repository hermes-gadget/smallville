<!DOCTYPE html>
{% load staticfiles %}
<html lang="en">
<head>
	<meta charset="UTF-8">
  <title>Reverie</title>
  <!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
	<!-- Optional theme -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap-theme.min.css" integrity="sha384-6pzBo3FDv/PJ8r2KRkGHifhEocL+1X2rVCTTkUfGk7/0pbek5mMa1upzvWbrUbOZ" crossorigin="anonymous">

</head>
 
<body class="top-navigation">
  {% block content %}
	{% endblock content %}

	<!-- Latest compiled and minified JavaScript -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js" integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-latest.min.js" type="text/javascript"></script>

	{% block js_content %}
	{% endblock js_content %}

	<script type="text/javascript" id="clustrmaps" src="//clustrmaps.com/map_v2.js?d=Xha1v8a6ENHDAgZ2dJoH85LCl6H1VwpYfgwfbgau8r4&cl=ffffff&w=a"></script>
	<style type="text/css">
		#clustrmaps-widget-v2 {
			display: none !important
		}
	</style>

	<!-- LLM token usage monitor (hermes-gadget fork) -->
	<div id="token-monitor" style="position:fixed; top:18px; right:20px; z-index:9999; background:rgba(9,18,30,0.92); color:#dce8ef; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; padding:13px 15px; border:1px solid rgba(104,224,190,.22); border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.28); min-width:240px; pointer-events:none; backdrop-filter:blur(12px);">
		<div style="font-weight:bold; margin-bottom:6px; letter-spacing:0.5px;">🤖 LLM tokens</div>
		<div><span id="tm-total">0</span> total &middot; <span id="tm-calls">0</span> calls</div>
		<div>prompt <span id="tm-prompt">0</span> &middot; completion <span id="tm-completion">0</span></div>
		<div>embeddings <span id="tm-emb-calls">0</span> calls (<span id="tm-emb-tokens">0</span> tk)</div>
		<div>all-time <span id="tm-cum">0</span> tk &middot; <span id="tm-cum-calls">0</span> calls</div>
		<div id="tm-models" style="opacity:0.75;"></div>
		<div style="opacity:0.6; margin-top:4px;">updated <span id="tm-updated">-</span> &middot; since <span id="tm-started">-</span></div>
	</div>
	<script type="text/javascript">
		function refreshTokenMonitor(){
			$.getJSON('/get_token_usage/', function(d){
				var n = function(v){ return (v||0).toLocaleString(); };
				$('#tm-total').text(n(d.total_tokens));
				$('#tm-prompt').text(n(d.prompt_tokens));
				$('#tm-completion').text(n(d.completion_tokens));
				$('#tm-calls').text(n(d.calls));
				$('#tm-emb-calls').text(n(d.embedding_calls));
				$('#tm-emb-tokens').text(n(d.embedding_tokens));
				if (d.cumulative) {
					$('#tm-cum').text(n(d.cumulative.total_tokens));
					$('#tm-cum-calls').text(n(d.cumulative.calls));
				}
				$('#tm-updated').text(d.updated_at || '-');
				$('#tm-started').text(d.started_at || '-');
				var models = Object.entries(d.by_model || {})
					.map(function(kv){ return kv[0] + ': ' + n(kv[1]); })
					.join(' &middot; ');
				$('#tm-models').html(models);
			}).fail(function(){});
		}
		$(document).ready(function(){ refreshTokenMonitor(); setInterval(refreshTokenMonitor, 2000); });
	</script>
	<style>
		:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8f0f2;background:#07121d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07121d}body{overflow:hidden}.simulator-shell{height:100vh;display:flex;background:radial-gradient(circle at 70% 10%,#123044 0,#07121d 55%);color:#e8f0f2}.persona-sidebar{width:294px;flex:none;padding:29px 18px 18px;background:rgba(8,19,30,.94);border-right:1px solid rgba(157,209,205,.14);display:flex;flex-direction:column;z-index:20}.sidebar-heading{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:2px;color:#6fe2bf;font-weight:700}.sidebar-heading h1{font-size:25px;margin:6px 0 0;letter-spacing:-.7px}.sidebar-note{font-size:12px;color:#8197a3;margin:12px 2px 20px}.live-pulse,.status-dot{display:inline-block;width:7px;height:7px;background:#6fe2bf;border-radius:50%;box-shadow:0 0 0 4px rgba(111,226,191,.1);margin-right:7px}.persona-list{overflow-y:auto;flex:1;padding-right:3px}.persona-card{width:100%;display:flex;align-items:center;text-align:left;color:inherit;background:transparent;border:1px solid transparent;border-radius:12px;padding:10px 8px;margin-bottom:5px;cursor:pointer;transition:.2s}.persona-card:hover,.persona-card.active{background:rgba(111,226,191,.09);border-color:rgba(111,226,191,.22)}.persona-card img{width:40px;height:40px;object-fit:cover;image-rendering:pixelated;border-radius:10px;background:#1b3440;margin-right:11px}.persona-copy{min-width:0;flex:1}.persona-copy strong,.persona-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.persona-copy strong{font-size:13px}.persona-copy small{font-size:11px;color:#8da3ad;margin-top:3px}.persona-copy .persona-location{color:#627d88;font-size:10px}.status-dot{width:6px;height:6px;margin:0 3px 0 8px}.sidebar-footer{font-size:11px;color:#58727e;padding-top:15px;border-top:1px solid rgba(157,209,205,.1)}.sidebar-footer span{float:right;color:#6fe2bf;font-size:16px}.sidebar-close,.menu-button{display:none}.map-stage{position:relative;flex:1;min-width:0;overflow:hidden}.map-stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,12,20,.18),transparent 35%,rgba(4,12,20,.25))}.map-toolbar{position:absolute;z-index:10;top:22px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.map-title{display:flex;align-items:center;gap:10px}.map-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#071b25;background:#6fe2bf;font-size:19px;box-shadow:0 6px 18px rgba(111,226,191,.18)}.map-title strong{display:block;font-size:16px}.map-title small{display:block;color:#89a1ab;font-size:11px;margin-top:2px}.map-controls{display:flex;gap:15px;align-items:center}.hint{font-size:9px;letter-spacing:1.4px;color:#a2b6bd}.time-chip{font-size:12px;background:rgba(9,21,31,.8);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 12px}.time-chip b{color:#f3c56c;margin-left:4px}.map-stage #game-container{height:100%;cursor:grab}.map-stage #game-container:active{cursor:grabbing}.map-stage canvas{display:block!important;width:100%!important;height:100%!important}.map-tip{position:absolute;z-index:5;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:#b2c3c8;background:rgba(8,20,30,.75);border:1px solid rgba(255,255,255,.1);padding:8px 13px;border-radius:20px;pointer-events:none}.map-tip span{color:#6fe2bf;margin:0 6px}
		@media(max-width:720px){body{overflow:hidden}.persona-sidebar{position:absolute;left:0;top:0;bottom:0;width:min(88vw,310px);transform:translateX(-102%);transition:transform .25s;box-shadow:15px 0 40px rgba(0,0,0,.4)}.persona-sidebar.open{transform:translateX(0)}.sidebar-close,.menu-button{display:block;border:0;color:#dce8ef;background:rgba(255,255,255,.08);border-radius:8px;width:32px;height:32px;font-size:18px}.menu-button{pointer-events:auto}.map-toolbar{left:16px;right:16px;top:15px}.map-title{margin-left:10px;margin-right:auto}.map-title small,.hint{display:none}.map-controls{margin-left:10px}.map-tip{bottom:14px;white-space:nowrap}.map-stage #game-container{height:100vh}}
	</style>
</body>
</html>
